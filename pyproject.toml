[project]
name = "cisp-mcp"
version = "0.1.0"
description = "MCP server for CISP API integrations"
readme = "README.md"
authors = [
    { name = "fangwei", email = "fangwei@zenitera.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography<49",
    "httpx[socks]>=0.28.1",
    "mcp[cli]>=1.27.2,<2",
    "pillow>=12.2,<12.3",
    "pypdf>=5",
    "python-dotenv>=1.2.2",
    "reportlab>=4.2",
]

[project.scripts]
cisp-mcp = "cisp_mcp:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
